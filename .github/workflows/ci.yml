name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      ATLAS_INDEX_PATH: /tmp/atlas-ci-rag.sqlite3
      ATLAS_ACTION_LOG: /tmp/atlas-ci-actions.jsonl
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Materialise checksum-verified source tree
        shell: bash
        run: |
          if [ -f .score5/expand.py ]; then
            python .score5/expand.py
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall app agent rag mcp_server mcp_client evaluation scripts

      - name: Build persistent RAG index
        run: python scripts/build_index.py --force

      - name: Run complete test suite
        run: pytest -q

      - name: Verify genuine MCP discovery and calls
        run: python scripts/smoke_mcp.py > evaluation/mcp-smoke-result.json

      - name: Start application and run deep health check
        env:
          ATLAS_MCP_TRANSPORT: stdio
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/atlas-uvicorn.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true; cat /tmp/atlas-uvicorn.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:8000/health?deep=true' > evaluation/health-result.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          data = json.load(open('evaluation/health-result.json', encoding='utf-8'))
          assert data['status'] == 'ok', data
          assert data['mcp']['status'] == 'available', data
          assert len(data['mcp']['tools']) >= 8, data
          assert data['rag_index']['documents'] == 14, data
          PY

      - name: Run golden-set evaluation
        env:
          ATLAS_MCP_TRANSPORT: inprocess
        run: python evaluation/run_evaluation.py --transport inprocess --output evaluation/ci-results.json --markdown evaluation/ci-results.md

      - name: Run retrieval ablation
        run: python evaluation/run_ablation.py --output evaluation/ci-ablation-results.json --markdown evaluation/ci-ablation-results.md

      - name: Upload evaluation and MCP evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-score-5-evidence
          path: |
            evaluation/ci-results.json
            evaluation/ci-results.md
            evaluation/ci-ablation-results.json
            evaluation/ci-ablation-results.md
            evaluation/mcp-smoke-result.json
            evaluation/health-result.json
