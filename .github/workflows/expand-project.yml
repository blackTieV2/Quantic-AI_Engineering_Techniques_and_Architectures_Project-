name: Recover Atlas project source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-project.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-atlas-project-source
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode archive parts
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          test -n "$(find .bootstrap -maxdepth 1 -name 'project.b64.*' -print -quit)"
          cat .bootstrap/project.b64.* | base64 --decode > /tmp/project.tar.gz

      - name: Recover tar payload despite damaged gzip trailer
        shell: bash
        run: |
          set +e
          gzip -dc /tmp/project.tar.gz > /tmp/project.tar
          GZIP_STATUS=$?
          echo "gzip_status=$GZIP_STATUS"
          test -s /tmp/project.tar || exit 1
          tar -tf /tmp/project.tar > /tmp/project-files.txt
          TAR_STATUS=$?
          echo "tar_status=$TAR_STATUS"
          test "$TAR_STATUS" -eq 0 || exit 1
          test -s /tmp/project-files.txt || exit 1
          echo "Recovered $(wc -l < /tmp/project-files.txt) archive entries."

      - name: Expand recovered project
        shell: bash
        run: |
          set -euo pipefail
          tar -xf /tmp/project.tar -C . \
            --exclude='.github/workflows' \
            --exclude='.github/workflows/*'
          rm -rf .bootstrap
          rm -f docs/bootstrap-diagnostic.txt

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: recover Atlas project source"
          git push origin HEAD:main
