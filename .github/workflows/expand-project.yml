name: Diagnose committed project archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test archive and record evidence
        shell: bash
        run: |
          set +e
          mkdir -p docs
          REPORT=docs/bootstrap-diagnostic.txt
          : > "$REPORT"
          echo "Archive bootstrap diagnostic" >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"
          echo "Runner: $RUNNER_OS" >> "$REPORT"
          echo >> "$REPORT"
          echo "Parts:" >> "$REPORT"
          find .bootstrap -maxdepth 1 -name 'project.b64.*' -printf '%f %s bytes\n' | sort >> "$REPORT" 2>&1
          echo >> "$REPORT"
          echo "Decode test:" >> "$REPORT"
          cat .bootstrap/project.b64.* | base64 --decode > /tmp/project.tar.gz 2>> "$REPORT"
          DECODE_STATUS=$?
          echo "decode_exit=$DECODE_STATUS" >> "$REPORT"
          if [ "$DECODE_STATUS" -eq 0 ]; then
            gzip -t /tmp/project.tar.gz 2>> "$REPORT"
            GZIP_STATUS=$?
            echo "gzip_exit=$GZIP_STATUS" >> "$REPORT"
            if [ "$GZIP_STATUS" -eq 0 ]; then
              tar -tzf /tmp/project.tar.gz > /tmp/project-files.txt 2>> "$REPORT"
              TAR_STATUS=$?
              echo "tar_list_exit=$TAR_STATUS" >> "$REPORT"
              echo "archive_file_count=$(wc -l < /tmp/project-files.txt)" >> "$REPORT"
              echo >> "$REPORT"
              echo "First archive paths:" >> "$REPORT"
              head -40 /tmp/project-files.txt >> "$REPORT"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record archive expansion diagnostic"
            git push origin HEAD:main
          fi
          exit 0
