name: Expand Atlas project archive

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write

jobs:
  expand:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/score-5-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/score-5-foundation
          fetch-depth: 0

      - name: Expand committed project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.b64.* | base64 --decode > /tmp/atlas-project.tar.gz
          tar -xzf /tmp/atlas-project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project is already expanded."
            exit 0
          fi
          git commit -m "feat: expand Atlas score-5 project source"
          git push origin HEAD:feature/score-5-foundation
