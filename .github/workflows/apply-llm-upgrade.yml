name: Apply active LLM provider upgrade

on:
  push:
    branches: [feature/active-llm-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/active-llm-provider
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply upgrade
        run: python scripts/apply_llm_provider_upgrade.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_llm_provider_upgrade.py
          rm .github/workflows/apply-llm-upgrade.yml
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate
        env:
          PYTHONPATH: .
          ATLAS_MCP_TRANSPORT: inprocess
          ATLAS_INDEX_PATH: /tmp/atlas-llm-upgrade.sqlite3
          ATLAS_ACTION_LOG: /tmp/atlas-llm-upgrade-actions.jsonl
        run: |
          python -m compileall app agent rag mcp_server mcp_client evaluation scripts
          python scripts/build_index.py --force
          pytest -q
          python scripts/smoke_mcp.py
      - name: Commit upgraded source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: activate metadata-grounded LLM refinement" 
          git push origin HEAD:feature/active-llm-provider
