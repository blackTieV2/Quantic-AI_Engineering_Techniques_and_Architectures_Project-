name: Expand verified Atlas score-5 source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: atlas-score-5-expansion
  cancel-in-progress: false

jobs:
  expand:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/score5-expanded'
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled expansion branch
        uses: actions/checkout@v4
        with:
          ref: feature/score5-expanded
          fetch-depth: 0

      - name: Expand checksum-verified source tree
        run: python .score5/expand.py

      - name: Commit complete source tree to pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: complete Atlas score-5 MCP RAG architecture"
          git push origin HEAD:feature/score5-expanded
